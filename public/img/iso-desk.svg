<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220">
  <!-- ===== 等距(isometric)办公工位 demo =====
       30° 投影：X右下 / Y左下 / Z上
       红三角机构配色：白底 + 警示红
       生成逻辑见 office-iso.js 的 isoBox/isoPlane 函数 ===== -->

  <!-- 地面阴影 -->
  <ellipse cx="120" cy="200" rx="78" ry="16" fill="#e63946" opacity="0.08"/>

  <!-- 桌腿（4根，先画后腿/侧腿，再画前腿，保证遮挡正确） -->
  <!-- 左后腿 -->
  <path d="M64,118 L54,128 L54,168 L64,158 Z" fill="#c1121f"/>
  <!-- 右后腿 -->
  <path d="M176,118 L186,128 L186,168 L176,158 Z" fill="#a80d18"/>
  <!-- 左前腿 -->
  <path d="M82,150 L72,160 L72,188 L82,178 Z" fill="#e63946"/>
  <!-- 右前腿 -->
  <path d="M158,150 L168,160 L168,188 L158,178 Z" fill="#c1121f"/>

  <!-- 桌面（顶面=最亮，左侧面=中，右侧面=暗） -->
  <!-- 桌面顶（平行四边形，等距菱形） -->
  <path d="M120,96 L186,128 L120,160 L54,128 Z" fill="#ffffff" stroke="#e63946" stroke-width="2" stroke-linejoin="round"/>
  <!-- 桌面厚度-右侧面 -->
  <path d="M186,128 L186,140 L120,172 L120,160 Z" fill="#fce8eb"/>
  <!-- 桌面厚度-左侧面 -->
  <path d="M54,128 L54,140 L120,172 L120,160 Z" fill="#f9cdd2"/>

  <!-- 桌面中央装饰：倒三角（机构 logo） -->
  <path d="M120,112 L110,132 L130,132 Z" fill="#e63946" opacity="0.9"/>

  <!-- 显示器底座 -->
  <path d="M120,86 L138,95 L120,104 L102,95 Z" fill="#e63946"/>

  <!-- 显示器屏幕（竖立立方体） -->
  <!-- 屏幕背面右 -->
  <path d="M138,95 L138,48 L120,39 L120,86 Z" fill="#fce8eb"/>
  <!-- 屏幕背面左 -->
  <path d="M102,95 L102,48 L120,39 L120,86 Z" fill="#ffffff"/>
  <!-- 屏幕顶面（俯视，薄） -->
  <path d="M120,39 L138,48 L120,57 L102,48 Z" fill="#ffffff" stroke="#e63946" stroke-width="1.5"/>
  <!-- 屏幕正面（朝右下观察者） -->
  <path d="M102,48 L120,39 L120,86 L102,95 Z" fill="#1a1a1a" stroke="#e63946" stroke-width="1.5"/>
  <!-- 屏幕内容线 -->
  <line x1="106" y1="54" x2="117" y2="49" stroke="#e63946" stroke-width="1" opacity="0.7"/>
  <line x1="106" y1="60" x2="115" y2="56" stroke="#e63946" stroke-width="1" opacity="0.7"/>
  <line x1="106" y1="66" x2="117" y2="61" stroke="#e63946" stroke-width="1" opacity="0.7"/>
  <line x1="106" y1="72" x2="113" y2="69" stroke="#e63946" stroke-width="1" opacity="0.5"/>

  <!-- 键盘（桌面上的小薄板） -->
  <path d="M138,128 L162,140 L138,152 L114,140 Z" fill="#1a1a1a" stroke="#e63946" stroke-width="1.2"/>
  <path d="M138,128 L162,140 L162,143 L138,131 Z" fill="#333"/>

  <!-- 椅子（在桌前下方） -->
  <!-- 椅背 -->
  <path d="M100,176 L140,176 L140,196 L100,196 Z" fill="#e63946" opacity="0.85"/>
  <!-- 椅座顶（菱形） -->
  <path d="M120,178 L150,193 L120,208 L90,193 Z" fill="#ffffff" stroke="#e63946" stroke-width="1.5"/>
  <!-- 椅座右侧面 -->
  <path d="M150,193 L150,196 L120,211 L120,208 Z" fill="#fce8eb"/>
  <!-- 椅子中柱 -->
  <path d="M120,208 L120,214 L116,217 L116,211 Z" fill="#c1121f"/>
  <!-- 椅子底盘（五星脚俯视） -->
  <path d="M120,214 L96,210 L108,224 L120,218 L132,224 L144,210 Z" fill="#1a1a1a" opacity="0.8"/>
</svg>
