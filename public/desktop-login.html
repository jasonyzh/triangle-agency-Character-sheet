  .tri-content { position: absolute; left: 48%; top: 54%; transform: translateY(-50%); width: 40%; }

  /* ================= 桌面道具 ================= */

  .kb-rows { left: 12px; top: 11px; right: 12px; bottom: 11px; }

  .mouse {

    background: linear-gradient(180deg, #ffffff 0%, #eff1f3 100%);
    border-radius: 50% 50% 46% 46% / 62% 62% 40% 40%;
    box-shadow: 0 10px 18px rgba(30,40,60,.12), inset 0 -3px 0 #e0e3e7;
  }
  .mouse::before { content: ''; position: absolute; left: 50%; top: 8px; width: 2px; height: 22px; background: #dcdfe3; transform: translateX(-50%); }

  .pen-holder {
    left: 87px; top: 585px; width: 115px; height: 138px;
    background: linear-gradient(180deg, #e2503c 0%, #d13a28 100%);
    border-radius: 8px;

  .pencil { width: 13px; border-radius: 3px 3px 0 0; }

  .p-black { background: #3a3d42; height: 96px; left: 8px; top: -78px; transform: rotate(-5deg); }
  .p-grey  { background: #9aa0a8; height: 84px; left: 34px; top: -66px; }
  .p-red   { background: #e0503c; height: 92px; left: 60px; top: -72px; transform: rotate(4deg); }
  .p-white { background: #f2f3f5; height: 78px; left: 84px; top: -58px; transform: rotate(7deg); border: 1px solid #e0e3e8; }

  .pot {
    left: 217px; top: 590px; width: 104px; height: 106px;
    background: linear-gradient(180deg, #ffffff 0%, #eef0f2 100%);
    border-radius: 8px 8px 14px 14px;
    box-shadow: 0 12px 20px rgba(30,40,60,.12), inset -6px 0 10px rgba(0,0,0,.05);
  }
  .pot::before { content: ''; position: absolute; left: 50%; top: -8px; width: 84px; height: 12px; background: #e4e7ea; border-radius: 4px; transform: translateX(-50%); }
  .plant-svg { left: 178px; top: 452px; width: 182px; height: 148px; }

  .mug {
    left: 1287px; top: 599px; width: 106px; height: 124px;
    background: linear-gradient(180deg, #ffffff 0%, #f0f2f4 100%);
    border-radius: 6px 6px 16px 16px;
    box-shadow: 0 14px 22px rgba(30,40,60,.13), inset -10px 0 14px rgba(0,0,0,.06);
  }
  .mug::before {
    content: ''; position: absolute; left: 6px; right: 6px; top: -8px; height: 18px;
    border-radius: 50%; background: #d8402f; box-shadow: inset 0 3px 4px rgba(0,0,0,.22);
  }
  .mug::after {
    content: ''; position: absolute; right: -34px; top: 26px;
    width: 40px; height: 46px;
    border: 13px solid #f4f5f7; border-radius: 0 22px 22px 0; border-left: none;
    box-shadow: inset -3px 3px 4px rgba(0,0,0,.05);
  }

  /* ================= 欢迎过场 ================= */
  .welcome-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(160deg, #e5533f 0%, #d8402f 55%, #b52e20 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    opacity: 0; pointer-events: none; transition: opacity .6s ease;
  }
  .welcome-overlay.show { opacity: 1; pointer-events: auto; }
  .welcome-overlay .big { font-size: 42px; color: #fff; font-weight: 300; letter-spacing: .1em; text-shadow: 0 4px 16px rgba(120,20,10,.4); }
  .welcome-overlay .sub { font-size: 15px; color: rgba(255,255,255,.85); letter-spacing: .2em; }
  .welcome-overlay .out {
    margin-top: 26px; padding: 10px 30px; border-radius: 22px;
    border: 2px solid rgba(255,255,255,.7); color: #fff; font-size: 14px; letter-spacing: .1em;
    transition: background .2s;
  }
  .welcome-overlay .out:hover { background: rgba(255,255,255,.15); }

  /* ================= 登录成功过场：红色三角从中心填满显示器屏幕区域 ================= */
  .tri-fill { position: absolute; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
  .tri-fill .tri-shape {
    position: absolute; left: 50%; top: 50%;
    width: 230%; height: 230%;
    background: linear-gradient(180deg, #e5533f 0%, #d8402f 100%);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    transform: translate(-50%, -66.7%) scale(0);
    transform-origin: 50% 66.7%;
    transition: transform .55s cubic-bezier(.65,.05,.25,1);
  }
  .tri-fill.active .tri-shape { transform: translate(-50%, -66.7%) scale(1); }
  .tri-fill svg {
    position: absolute; left: 50%; top: 66.7%; width: 17%; height: 25%;
    transform: translate(-50%, -50%); opacity: .92;
  }

  /* ================= 手机端（≤860px）：手持手机插画场景（login.html 手机适配） ================= */
  .stage, .bg-deco { display: none; }
  @media (max-width: 860px) {
    .viewport { display: none !important; }
    .stage, .bg-deco { display: block !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        height: 100vh;
        background: #f0eeec;
        font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        overflow: hidden;
    }
    /* ===== 背景几何装饰 ===== */
    .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bg-deco .circle-a { position: absolute; right: -90px; top: -70px; width: 300px; height: 300px; border-radius: 50%; background: #fff; }
    .bg-deco .circle-b { position: absolute; right: 60px; bottom: 90px; width: 120px; height: 120px; border-radius: 50%; background: #fff; }
    .bg-deco .dots-a {
        position: absolute; left: 7%; top: 6%;
        width: 90px; height: 66px;
        background-image: radial-gradient(rgba(0,0,0,.10) 2.2px, transparent 2.4px);
        background-size: 15px 15px;
    }
    .bg-deco .dots-b {
        position: absolute; left: 10%; bottom: 12%;
        width: 90px; height: 66px;
        background-image: radial-gradient(rgba(0,0,0,.08) 2.2px, transparent 2.4px);
        background-size: 15px 15px;
    }
    .bg-deco .dotspad {
        position: absolute; right: 5%; top: 10%;
        width: 34px; height: 26px;
        background-image: radial-gradient(#d3322a 2.2px, transparent 2.4px);
        background-size: 13px 13px;
    }
    .bg-deco svg.tri { position: absolute; }
    @media (max-width: 900px) { .bg-deco { position: absolute; } }

    /* ===== 插画舞台 ===== */
    .stage {
        position: absolute;
        left: 0; bottom: 0;
        width: min(88vw, 100vh * 0.4761);
        aspect-ratio: 776 / 1630;
        z-index: 1;
    }
    .stage .hand { display: block; width: 100%; height: 100%; pointer-events: none; }
    .screen {
        position: absolute;
        left: 26%; top: 0.5%;
        width: 61.7%; height: 67.1%;
        background: transparent;
        overflow: hidden;
        font-size: var(--su, 15.5px);
        display: flex; align-items: center; justify-content: center;
        padding-top: 24%; padding-bottom: 3%;
    }
    .content { width: 78%; display: block; }

    /* 屏内红对角 + 点阵 */
    .corner { position: absolute; top: 0; right: 0; width: 46%; height: 27%;
        background: linear-gradient(215deg, #d3322a 0%, #c12820 52%, #ffffff 52.5%);
        clip-path: polygon(100% 0, 100% 100%, 0 0); }
    .corner::after { content: ''; position: absolute; right: 14px; top: 12px; width: 46px; height: 36px;
        background-image: radial-gradient(#d3322a 2.4px, transparent 2.6px); background-size: 12px 12px; }
    .corner-b { position: absolute; bottom: 0; left: 0; width: 54%; height: 24%;
        background: linear-gradient(35deg, #ffffff 47.5%, #c12820 48%, #d3322a 100%);
        clip-path: polygon(0 0, 100% 100%, 0 100%); }
    .dots-l { position: absolute; left: -6px; bottom: 54px; width: 62px; height: 46px;
        background-image: radial-gradient(rgba(120,100,90,.30) 2.2px, transparent 2.4px); background-size: 13px 13px; }
    .tri-deco { position: absolute; fill: rgba(211,50,42,.16); }
    .logo { position: absolute; left: 6%; top: 4%; width: 2.3em; height: 2.3em; }
    .logo svg { width: 100%; height: 100%; display: block; }
    .brand { text-align: center; margin: 1.7em 0; position: relative; z-index: 2; }
    .brand h1 { font-size: 2.3em; font-weight: 900; letter-spacing: .25em; text-indent: .25em; color: #d3322a; font-family: 'Roboto Mono', monospace; }
    .brand p { margin-top: .5em; font-size: .72em; letter-spacing: .38em; text-indent: .38em; color: #9b948e; font-family: 'Roboto Mono', monospace; text-transform: uppercase; }
    .field { display: flex; align-items: center; margin-bottom: .85em; position: relative; z-index: 2; }
    .field-ico { width: 2.6em; height: 2.6em; flex: none; background: #d3322a; color: #fff;
        border-radius: .55em; margin-right: .52em; display: flex; align-items: center; justify-content: center; font-size: .95em; }
    .field input { flex: 1; min-width: 0; height: 2.6em; border: 1px solid #e7e3df; border-radius: .55em; background: #fff;
        padding: 0 .85em; font-size: .9em; color: #2b2430; outline: none; font-family: inherit;
        transition: border-color .15s, box-shadow .15s; }
    .field input:focus { border-color: #d3322a; box-shadow: 0 0 0 3px rgba(211,50,42,.10); }
    .btn-verify { width: 100%; height: 2.9em; margin-top: .32em; background: #d3322a; color: #fff; border: none;
        border-radius: .6em; font-size: .95em; font-weight: 700; letter-spacing: .2em; cursor: pointer;
        font-family: inherit; position: relative; z-index: 2; display: flex; align-items: center;
        justify-content: center; gap: 8px; transition: background .15s; box-shadow: 0 8px 18px rgba(211,50,42,.25); }
    .btn-verify:hover { background: #b92c24; }
    .btn-verify:active { transform: scale(.985); }
    .status-msg { margin-top: .8em; text-align: center; font-size: .8em; color: #a33; display: none; position: relative; z-index: 2; }
    .status-msg.show { display: block; }
    .status-msg.ok { color: #1e8e4e; }
    .register-link { margin-top: .8em; text-align: center; font-size: .8em; color: #8f8880; position: relative; z-index: 2; }
    .register-link a { color: #8f8880; text-decoration: none; }
    .register-link span { color: #d3322a; font-weight: 700; }
    .loading-mask { position: absolute; inset: 0; background: #fdfbfa; z-index: 5; border-radius: 0;
        display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity .4s; }
    .loading-mask.show { opacity: 1; pointer-events: auto; }
    .loading-mask i { color: #d3322a; font-size: 2em; }
    .loading-mask span { font-size: .85em; color: #9b948e; letter-spacing: .1em; }
  }
</style>

<!-- 登录成功过场：红色三角填满显示器屏幕区域 → 屏幕放大 → desktop.html 倒放缩小 -->
<script src="js/desktop/login.js"></script>
<script>
/* 手机端（≤860px）：手持插画场景的登录逻辑（与 login.html 手机适配一致） */
(function () {
  var mUser = document.getElementById('mUser');
  var mPass = document.getElementById('mPass');
  var mBtn = document.getElementById('mBtn');
  var mMsg = document.getElementById('mMsg');

  function isMobile() { return window.matchMedia('(max-width: 860px)').matches; }
  function showErr(msg) {
    mMsg.textContent = msg;
    mMsg.classList.add('show');
    clearTimeout(showErr.t);
    showErr.t = setTimeout(function () { mMsg.classList.remove('show'); }, 2600);
  }

  function mLogin() {
    if (!isMobile()) return;
    var u = mUser.value.trim();
    var p = mPass.value;
    if (!u) { showErr('Please enter your username'); return; }
    if (!p) { showErr('Please enter your password'); return; }
    mMsg.classList.remove('show');
    mBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
    mBtn.setAttribute('disabled', 'disabled');

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.success) {
        showErr(data.message || '账号或密码错误');
        mBtn.innerHTML = '<span>SIGN IN</span><i class="fas fa-arrow-right"></i>';
        mBtn.removeAttribute('disabled');
        return;
      }
      localStorage.setItem('ta_uid', data.userId);
      localStorage.setItem('ta_token', data.token);
      localStorage.setItem('ta_role', data.role);
      if (data.isAdmin) localStorage.setItem('ta_is_admin', 'true'); else localStorage.removeItem('ta_is_admin');
      if (data.isManager) localStorage.setItem('ta_is_manager', 'true'); else localStorage.removeItem('ta_is_manager');
      if (data.branches && data.branches.length && !localStorage.getItem('ta_current_branch')) {
        localStorage.setItem('ta_current_branch', data.branches[0].id);
      }
      document.getElementById('mLoadingMask').classList.add('show');
      setTimeout(function () {
        window.location.href = 'desktop.html';
      }, 900);
    })
    .catch(function () {
      showErr('Server connection failed');
      mBtn.innerHTML = '<span>SIGN IN</span><i class="fas fa-arrow-right"></i>';
      mBtn.removeAttribute('disabled');
    });
  }

  mBtn.addEventListener('click', mLogin);
  mUser.addEventListener('keydown', function (e) { if (e.key === 'Enter') mLogin(); });
  mPass.addEventListener('keydown', function (e) { if (e.key === 'Enter') mLogin(); });

  /* 与 login.html 手机端一致：注册开启时显示"申请入职"链接 */
  fetch('/api/register/status')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.registrationEnabled) document.getElementById('mRegLink').style.display = 'block';
    })
    .catch(function () {});
})();
</script>
